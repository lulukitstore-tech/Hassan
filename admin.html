<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lulu Admin</title><link rel="icon" href="logo.jpg"><link rel="stylesheet" href="style.css"></head><body>
<header><img src="logo.jpg" alt=""><b>Lulu Admin Panel</b><button id="out" onclick="lo()" style="display:none">Logout</button></header>
<main id="login"><div class="box"><h3>Admin Login</h3><input id="em" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="btn" onclick="li()">Login</button></div></main>
<main id="app" style="display:none">
<div class="chips"><button class="on" data-t="o">📦 Orders</button><button data-t="p">🧺 Products</button><button data-t="n">🔔 Notification</button><button data-t="s">⚙️ Delivery</button></div>
<section id="o"></section>
<section id="p" style="display:none"><div class="box"><button class="btn o" onclick="demo()">⚡ Demo products daalo (16)</button></div><div class="box"><h4>Naya Product</h4><input id="pn" placeholder="Naam"><input id="pu" placeholder="Unit (1 kg)"><select id="pc"></select>
<input id="pm" type="number" placeholder="MRP ₹ (asli price)" oninput="pr()"><input id="pp" type="number" placeholder="Selling price ₹ (customer ko)" oninput="pr()"><div id="pv" style="margin:6px 0"></div>
<label>📷 Photos (max 4):</label><input id="pf" type="file" accept="image/*" multiple onchange="pf(event)" style="width:100%"><div id="pth" style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0"></div><small>Jis photo pe "Main" select hoga wahi pehle dikhegi</small><br><button class="btn" onclick="ap()">Add Product</button></div><div id="pl"></div></section>
<section id="s" style="display:none"><div class="box"><h4>Delivery Fee</h4><input id="df" type="number" placeholder="Delivery fee ₹ (0 likho = FREE)"><input id="dfa" type="number" placeholder="Itne ₹ se upar free (0 = nahi)"><button class="btn" onclick="sf()">Save</button></div></section>
<section id="n" style="display:none"><div class="box"><h4>Sab customers ko message</h4><input id="nt" placeholder="Title"><input id="nb" placeholder="Message" style="width:100%"><button class="btn o" onclick="sn()">Send</button></div></section></main>
<script type="module">
import {db,auth} from "./firebase.js";
import {signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {setDoc,collection,onSnapshot,addDoc,updateDoc,deleteDoc,doc,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {G,SN,DEMO} from "./cats.js";
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id),S=["Placed","Packed","Out for Delivery","Delivered","Cancelled"];
window.li=()=>signInWithEmailAndPassword(auth,$("em").value,$("pw").value).catch(e=>alert(e.message));
window.lo=()=>signOut(auth);
onAuthStateChanged(auth,u=>{const ok=u&&u.providerData.some(p=>p.providerId==="password");$("login").style.display=ok?"none":"block";$("app").style.display=ok?"block":"none";$("out").style.display=ok?"":"none";if(ok)start()});
document.addEventListener("click",e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll(".chips button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));["o","p","n","s"].forEach(x=>$(x).style.display=x==t?"block":"none")});
let started=0;function start(){if(started++)return;onSnapshot(doc(db,"settings","store"),s=>{const d=s.data()||{};$("df").value=d.fee??0;$("dfa").value=d.freeAbove??0});
 onSnapshot(query(collection(db,"orders"),orderBy("createdAt","desc")),s=>{$("o").innerHTML=s.docs.map(d=>{const o=d.data();return `<div class="box"><div class="row"><b>${E(o.name)} · ${E(o.phone)}</b><b>₹${o.total}</b></div><small>${E(o.address)}</small><br><small>Delivery: ${o.fee?"₹"+o.fee:"Free"}</small><br>${o.items.map(i=>E(i.name)+" × "+i.q).join(", ")}<br>
 <select onchange="us('${d.id}',this.value)">${S.map(x=>`<option ${x==o.status?"selected":""}>${x}</option>`).join("")}</select></div>`}).join("")||"Koi order nahi"});
 onSnapshot(collection(db,"products"),s=>{$("pl").innerHTML=s.docs.map(d=>{const p=d.data();return `<div class="box row"><span>${p.imgs?.[0]?`<img src="${p.imgs[0]}" style="width:44px;height:44px;object-fit:cover;border-radius:8px;vertical-align:middle"> `:""}${p.name} (${p.unit||""}) ₹${p.price} <small>${p.category||""}</small></span><span><button onclick="st('${d.id}',${p.stock===false})">${p.stock===false?"Out ❌":"In ✅"}</button> <button onclick="dp('${d.id}')">🗑</button></span></div>`}).join("")})}
$("pc").innerHTML=[...G,...SN].map(c=>`<option>${c[0]}</option>`).join("");
window.demo=async()=>{if(!confirm("16 demo products add karein?"))return;for(const d of DEMO)await addDoc(collection(db,"products"),{name:d[0],unit:d[1],price:d[2],mrp:d[3],category:d[4],img:"",stock:true});alert("Ho gaya ✅")};
window.us=(id,status)=>updateDoc(doc(db,"orders",id),{status});
window.st=(id,v)=>updateDoc(doc(db,"products",id),{stock:v});
window.dp=id=>confirm("Delete?")&&deleteDoc(doc(db,"products",id));
window.ap=async()=>{if(!$("pn").value||!$("pp").value)return alert("Naam aur price chahiye");
 await addDoc(collection(db,"products"),{name:$("pn").value,unit:$("pu").value,category:$("pc").value,price:+$("pp").value,mrp:+($("pm").value||$("pp").value),img:$("pi").value,stock:true});
 ["pn","pu","pc","pp","pm","pi"].forEach(i=>$(i).value="")};
let IM=[],MAIN=0;
const shrink=f=>new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,500/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL("image/jpeg",.7))};i.src=u});
function draw(){$("pth").innerHTML=IM.map((s,i)=>`<div style="text-align:center"><img src="${s}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;border:3px solid ${i==MAIN?"#1b8a3a":"transparent"}"><br><small><input type="radio" name="mn" ${i==MAIN?"checked":""} onchange="mm(${i})"> ${i==MAIN?"Main ✅":"Main?"}</small></div>`).join("")}
window.mm=i=>{MAIN=i;draw()};
window.pf=async e=>{const fs=[...e.target.files];if(fs.length>4)alert("Sirf pehli 4 photo li jayengi");IM=await Promise.all(fs.slice(0,4).map(shrink));MAIN=0;draw()};
window.pr=()=>{const m=+$("pm").value,p=+$("pp").value;$("pv").innerHTML=p?`Customer ko dikhega: <b>₹${p}</b>${m>p?` <s>₹${m}</s> · <b style="color:#1b8a3a">${Math.round((m-p)/m*100)}% OFF</b> · bachat ₹${m-p}`:""}`:""};
window.ap=async()=>{if(!$("pn").value||!$("pp").value)return alert("Naam aur price chahiye");const p=+$("pp").value,m=+($("pm").value||p);if(m<p)return alert("MRP selling price se kam nahi ho sakta");
 const imgs=IM.length?[IM[MAIN],...IM.filter((_,i)=>i!=MAIN)]:[];
 try{await addDoc(collection(db,"products"),{name:$("pn").value,unit:$("pu").value,category:$("pc").value,price:p,mrp:m,imgs,stock:true})}catch(e){return alert("Error: "+e.message)}
 ["pn","pu","pp","pm"].forEach(i=>$(i).value="");$("pf").value="";IM=[];draw();pr();alert("Product add ho gaya ✅")};
window.sf=async()=>{await setDoc(doc(db,"settings","store"),{fee:+$("df").value||0,freeAbove:+$("dfa").value||0});alert("Delivery fee save ✅")};
window.sn=async()=>{if(!$("nb").value)return;await addDoc(collection(db,"notifications"),{title:$("nt").value||"Lulu Kit Store",body:$("nb").value,createdAt:serverTimestamp()});$("nb").value="";alert("Bhej diya ✅")};
</script></body></html>
